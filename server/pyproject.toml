[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Закреплённый baseline проекта (E4, E7, E9, F): набор задан проектом
# и НЕ равен дефолтам ruff. Без явного `select` дефолты ruff (0.17.3)
# дрейфуют и дают ~80 ошибок вне baseline (факт: `ruff check . --isolated`
# — 82, из них 1 — из нового кода фичи; на зелёный прогон не влияет,
# т.к. RUF100 вне закреплённого select). Расширяем отдельным PR'ом,
# когда старые ошибки будут вычищены; сейчас важно не менять baseline.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
